kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: node
spec:
  nodeSelector: {}
  output:
    to:
      kind: ImageStreamTag
      name: 'node-uat:latest'
  resources: {}
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: 'nodejs:latest'
  postCommit: {}
  source:
    type: Git
    git:
      uri: 'https://github.com/laurobmb/Node-Js-Sample-Project'
      ref: nodejs-ocp
  triggers:
    - type: GitHub
      github:
        secret: yourpass
    - type: Generic
      generic:
        secret: yourpass
    - type: ConfigChange
    - type: ImageChange
      imageChange: {}
  runPolicy: Serial
